name: Build T5004 firmware

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t5004-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_JOBS: '4'
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - name: Check out build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Prepare hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          printf 'OPENWRT_DIR=%s/openwrt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd squashfs-tools fakeroot
          df -h "$RUNNER_TEMP"

      - name: Validate recipe
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Prepare pinned sources
        run: python3 scripts/prepare.py

      - name: Restore source downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: t5004-downloads-${{ runner.os }}-${{ hashFiles('config/sources.json', 'config/t5004.config', 'scripts/prepare.py') }}

      - name: Build firmware and optional packages
        run: bash scripts/build.sh

      - name: Save verified source downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Verify and collect artifacts
        run: python3 scripts/collect.py

      - name: Upload firmware, optional packages and corresponding sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t5004-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import tarfile
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from collect import flatten_checksums

          dist = Path('dist')
          flatten_checksums(dist)
          verification = json.loads((dist / 'verification.json').read_text())
          sources = json.loads((dist / 'sources.json').read_text())
          profiles = json.loads((dist / 'profiles.json').read_text())
          images = profiles['profiles']['iptime_t5004']['images']
          sysupgrade = next(image for image in images if image['type'] == 'sysupgrade')
          with tarfile.open(dist / 'firmware' / sysupgrade['name']) as archive:
              kernel_size = archive.getmember('sysupgrade-iptime_t5004/kernel').size

          commit = sources['openwrt']['commit']
          recipe_commit = os.environ['GITHUB_SHA']
          tag = f"v25.12-k{verification['kernel']}-{commit[:12]}-{recipe_commit[:12]}"
          title = f"T5004 OpenWrt 25.12 Linux {verification['kernel']} (prerelease)"
          notes = '\n'.join([
              f"# T5004 firmware {verification['kernel']}",
              '',
              f"- OpenWrt 25.12-SNAPSHOT, revision `custom-{commit[:12]}` (`{commit}`)",
              '- Target `ramips/mt7621`, device `iptime,t5004`',
              f"- Linux **{verification['kernel']}**; CVE-2026-98432 and CVE-2026-99288 source corrections verified",
              '- Dropbear SSH with `openssh-sftp-server`; OpenSSH server is not installed',
              '- WireGuard installed; AmneziaWG provided only as optional packages',
              f"- {verification['installed_package_count']} installed packages; optional package install simulation passed",
              f'- Kernel member {kernel_size:,} bytes (T5004 limit: 4 MiB)',
              f"- Recipe commit `{verification['recipe_commit']}`, Actions run `{verification['run_id']}` attempt `{verification['run_attempt']}`",
              '',
              '## Verification',
              '',
              '`SHA256SUMS`, image metadata, package manifest, rootfs payloads, credentials, corresponding sources, and the build recipe are included. Device boot and live networking have **not** been tested (`runtime_tested: false`).',
              '',
              '## Install',
              '',
              'Download `*-squashfs-sysupgrade.bin` and `SHA256SUMS` into the same directory. The checksum file uses flat Release asset names; `--ignore-missing` verifies the files you downloaded. Then install from an on-site LAN session:',
              '',
              '```sh',
              'sha256sum -c --ignore-missing SHA256SUMS',
              'sysupgrade -n /tmp/openwrt-ramips-mt7621-iptime_t5004-squashfs-sysupgrade.bin',
              '```',
              '',
              'Do not flash remotely. Review OpenWrt issue 25457 before using VLAN-aware bridge STP.',
          ])
          Path(os.environ['RUNNER_TEMP'], 't5004-release-notes.md').write_text(notes)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
              output.write(f'title={title}\n')
          PY

      - name: Publish verified firmware as a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          title="${{ steps.release.outputs.title }}"
          notes="$RUNNER_TEMP/t5004-release-notes.md"
          mapfile -d '' assets < <(find dist -type f -print0 | sort -z)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes" --prerelease
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
          fi
          url="$(gh release view "$tag" --json url --jq .url)"
          printf 'Published firmware release: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t5004-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            ${{ env.OPENWRT_DIR }}/logs/
          if-no-files-found: ignore
          retention-days: 14
